name: Build KrushiMitra Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ./krushimitra_flutter
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./krushimitra_flutter
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: krushimitra-release-apk
          path: krushimitra_flutter/build/app/outputs/flutter-apk/app-release.apk
