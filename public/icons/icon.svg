<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Golden Sun/AI Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container / App Icon Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="200" r="160" fill="url(#sunGlow)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="4" />

  <!-- Rising Sun / Mandi Dawn Arc -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="14 10" opacity="0.4" />

  <!-- Central Sprout & Digital Growth Nodes -->
  <g filter="url(#shadow)">
    <!-- Main Stem -->
    <path d="M 256 360 C 256 290 256 220 256 180" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" />

    <!-- Left Sprout Leaf -->
    <path d="M 256 260 C 210 260 160 215 150 150 C 215 150 250 200 256 260 Z" fill="url(#leafGrad1)" />

    <!-- Right Sprout Leaf -->
    <path d="M 256 220 C 302 220 352 175 362 110 C 297 110 262 160 256 220 Z" fill="url(#leafGrad2)" />

    <!-- Bottom Soil / Furrow Curves -->
    <path d="M 170 380 Q 256 410 342 380" fill="none" stroke="#fcd34d" stroke-width="10" stroke-linecap="round" />
    <path d="M 195 408 Q 256 432 317 408" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- AI Digital Node Accents -->
    <circle cx="150" cy="150" r="12" fill="#fbbf24" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
    <circle cx="362" cy="110" r="12" fill="#fbbf24" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />
    <circle cx="256" cy="180" r="14" fill="#a7f3d0" stroke="#047857" stroke-width="4" />

    <!-- Digital Connection Beams -->
    <line x1="150" y1="150" x2="200" y2="190" stroke="#fef08a" stroke-width="3" stroke-dasharray="4 4" opacity="0.8" />
    <line x1="362" y1="110" x2="305" y2="165" stroke="#fef08a" stroke-width="3" stroke-dasharray="4 4" opacity="0.8" />
  </g>

  <!-- KrushiMitra Text Banner / Devanagari Accent -->
  <g text-anchor="middle">
    <text x="256" y="468" font-family="'Noto Sans Devanagari', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#f0fdf4" letter-spacing="1">कृषिमित्र AI</text>
  </g>
</svg>
