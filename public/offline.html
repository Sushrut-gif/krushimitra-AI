<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ऑफलाइन मोड | KrushiMitra AI (कृषिमित्र)</title>
  <meta name="theme-color" content="#15803d">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #dc2626;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.25rem;
    }
    .info-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 0.75rem;
      padding: 1rem;
      text-align: left;
      font-size: 0.85rem;
      color: #166534;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .btn-primary {
      display: inline-block;
      width: 100%;
      background: #15803d;
      color: #ffffff;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      text-decoration: none;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(21, 128, 61, 0.2);
      transition: background 0.2s;
      margin-bottom: 0.75rem;
    }
    .btn-primary:hover {
      background: #166534;
    }
    .btn-secondary {
      display: inline-block;
      width: 100%;
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
      padding: 0.65rem 1rem;
      border-radius: 0.75rem;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>इंटरनेट कनेक्शन खंडित झाले आहे</h1>
    <p class="subtitle"><span class="status-dot"></span>तुम्ही सध्या ऑफलाइन आहात (You are Offline)</p>

    <div class="info-box">
      <strong>काळजी नसावी!</strong><br>
      तुमच्या फोनमध्ये कॅश केलेले सोलापूर APMC बाजार भाव, तयार केलेले गेटपास व पावत्या सुरक्षित आहेत. इंटरनेट सुरू होताच नवीन बोली व सौदे आपोआप समक्रमित होतील.
    </div>

    <button onclick="window.location.reload()" class="btn-primary">
      🔄 पुन्हा प्रयत्न करा (Try Again)
    </button>
    <a href="/" class="btn-secondary">
      🏠 मुख्य पानावर जा (Go to Home)
    </a>
  </div>
</body>
</html>
